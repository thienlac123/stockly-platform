services:
  db:
    image: postgres:16
    container_name: stockly-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: stockly
      POSTGRES_PASSWORD: stockly_dev
      POSTGRES_DB: stockly
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockly -d stockly"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: